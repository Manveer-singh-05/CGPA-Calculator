<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .courses-section {
            margin-bottom: 30px;
        }

        .course-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .course-item h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .course-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .grade-display {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #667eea;
            text-align: center;
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
        }

        .grade-points {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #764ba2;
            text-align: center;
            font-weight: bold;
            color: #764ba2;
            font-size: 16px;
        }

        .buttons-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-add {
            background: #667eea;
            color: white;
        }

        .btn-add:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-remove {
            background: #ff6b6b;
            color: white;
            flex: 0.3;
            padding: 10px;
        }

        .btn-remove:hover {
            background: #ff5252;
        }

        .btn-calculate {
            background: #51cf66;
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .btn-calculate:hover {
            background: #40c057;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(81, 207, 102, 0.4);
        }

        .result-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-section p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .cgpa-value {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }

        .btn-reset {
            background: #ffa500;
            color: white;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
        }

        .btn-reset:hover {
            background: #ff8c00;
        }

        .grade-criteria {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 13px;
            color: #666;
        }

        .grade-criteria h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .grade-criteria p {
            margin: 5px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📚 CGPA Calculator</h1>

        <div class="courses-section" id="coursesContainer">
            <!-- Course items will be added here -->
        </div>

        <div class="buttons-group">
            <button class="btn-add" onclick="addCourse()">+ Add Course</button>
        </div>

        <button class="btn-calculate" onclick="calculateCGPA()">Calculate CGPA</button>

        <div class="result-section" id="resultSection">
            <p>Your Semester CGPA</p>
            <div class="cgpa-value" id="cgpaValue">0.00</div>
            <p id="creditSummary"></p>
            <button class="btn-reset" onclick="resetCalculator()">Reset</button>
        </div>

        <div class="grade-criteria">
            <h4>Grade Criteria:</h4>
            <p><strong>O Grade:</strong> 90-100</p>
            <p><strong>A+ Grade:</strong> 80-90</p>
            <p><strong>A Grade:</strong> 70-80</p>
            <p><strong>B+ Grade:</strong> 60-70</p>
            <p><strong>B Grade:</strong> 50-60</p>
            <p><strong>C Grade:</strong> 40-50</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
