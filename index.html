<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator | Premium Edition</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for premium look -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #e2e8f0;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: var(--text-main);
            /* Animated dynamic background */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), inset 0 0 0 1px rgba(255, 255, 255, 0.3);
            padding: 40px;
            max-width: 650px;
            width: 100%;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), #8b5cf6);
            border-radius: 24px 24px 0 0;
        }

        h1 {
            color: var(--text-main);
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: -0.5px;
        }

        h1 i {
            color: var(--primary);
            font-size: 38px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .courses-section {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .course-item {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.8);
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .course-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .course-item h3 {
            color: var(--text-main);
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .course-item h3::before {
            content: '';
            display: block;
            width: 6px;
            height: 20px;
            background: linear-gradient(to bottom, var(--primary), #a855f7);
            border-radius: 4px;
        }

        .course-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        input:focus, select:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .displays-wrapper {
            grid-column: span 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 5px;
        }

        .display-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
        }

        .display-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .grade-display {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
        }

        .grade-points {
            font-size: 24px;
            font-weight: 800;
            color: var(--secondary);
        }

        .btn-remove {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fee2e2;
            color: var(--danger);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 18px;
        }

        .btn-remove:hover {
            background: var(--danger);
            color: white;
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .buttons-group {
            display: flex;
            margin-bottom: 25px;
        }

        button {
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-add {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            padding: 16px;
            flex: 1;
            border: 2px dashed rgba(99, 102, 241, 0.3);
        }

        .btn-add:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .btn-calculate {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            width: 100%;
            padding: 18px;
            font-size: 18px;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn-calculate::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #8b5cf6, var(--primary));
            z-index: -1;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .btn-calculate:hover::before {
            opacity: 1;
        }

        .btn-calculate:hover {
            box-shadow: 0 15px 25px rgba(99, 102, 241, 0.4);
            transform: translateY(-3px);
        }

        .result-section {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            display: none;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .result-section::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, var(--success), #34d399, var(--success));
            background-size: 200% 100%;
            animation: moveGradient 2s linear infinite;
        }

        @keyframes moveGradient {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .result-section.show {
            display: block;
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            50% { opacity: 1; transform: scale(1.02) translateY(-5px); }
            100% { transform: scale(1) translateY(0); }
        }

        .result-section p {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .cgpa-value {
            font-size: 64px;
            font-weight: 800;
            margin: 5px 0 15px;
            background: linear-gradient(135deg, var(--success), #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            letter-spacing: -2px;
        }

        #creditSummary {
            background: #f1f5f9;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .btn-reset {
            background: #f8fafc;
            color: var(--text-main);
            border: 1px solid #e2e8f0;
            width: 100%;
            padding: 14px;
        }

        .btn-reset:hover {
            background: #fee2e2;
            color: var(--danger);
            border-color: #fca5a5;
        }

        .grade-criteria {
            background: rgba(255,255,255,0.7);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .grade-criteria h4 {
            color: var(--text-main);
            margin-bottom: 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .criteria-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .criteria-item {
            background: #ffffff;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            border: 1px solid #f1f5f9;
            color: var(--text-muted);
            font-weight: 500;
        }
        
        .criteria-item strong {
            color: var(--primary);
            display: block;
            font-size: 16px;
            margin-bottom: 4px;
            font-weight: 800;
        }

        @media (max-width: 500px) {
            .container { padding: 25px; }
            .criteria-grid { grid-template-columns: repeat(2, 1fr); }
            .course-info { grid-template-columns: 1fr; gap: 15px; }
            .displays-wrapper { grid-column: span 1; }
            h1 { font-size: 26px; }
            .cgpa-value { font-size: 50px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="ph-fill ph-student"></i> CGPA Calculator</h1>

        <div class="courses-section" id="coursesContainer">
            <!-- Course items will be added here -->
        </div>

        <div class="buttons-group">
            <button class="btn-add" onclick="addCourse()"><i class="ph ph-plus-circle"></i> Add Course</button>
        </div>

        <button class="btn-calculate" onclick="calculateCGPA()"><i class="ph-fill ph-calculator"></i> Calculate CGPA</button>

        <div class="result-section" id="resultSection">
            <p>Your Semester CGPA is</p>
            <div class="cgpa-value" id="cgpaValue">0.00</div>
            <div id="creditSummary"></div>
            <button class="btn-reset" onclick="resetCalculator()"><i class="ph ph-arrow-counter-clockwise"></i> Reset</button>
        </div>

        <div class="grade-criteria">
            <h4><i class="ph ph-info"></i> Grade Criteria</h4>
            <div class="criteria-grid">
                <div class="criteria-item"><strong>O</strong> 90-100</div>
                <div class="criteria-item"><strong>A+</strong> 80-89</div>
                <div class="criteria-item"><strong>A</strong> 70-79</div>
                <div class="criteria-item"><strong>B+</strong> 60-69</div>
                <div class="criteria-item"><strong>B</strong> 50-59</div>
                <div class="criteria-item"><strong>C</strong> 40-49</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
